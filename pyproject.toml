[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.13"]
build-backend = "setuptools.build_meta"

[project]
name = "decima"
version = "1.3.0"
description = "Data Extraction & Contextual Inference for MCNP Analysis"
authors = [
    {name = "Quentin Ducasse"},
    {name = "Feda Almuhisen"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "blinker==1.9.0",
    "certifi==2025.4.26",
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "colorama==0.4.6",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "Flask==3.1.1",
    "flask-cors==6.0.1",
    "fonttools==4.58.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jiter==0.10.0",
    "jsonpatch==1.33",
    "jsonpointer==3.0.0",
    "kiwisolver==1.4.8",
    "langchain-core==0.3.61",
    "langgraph==0.4.7",
    "langgraph-checkpoint==2.0.26",
    "langsmith==0.3.42",
    "MarkupSafe==3.0.2",
    "matplotlib==3.10.3",
    "neo4j==5.28.1",
    "numpy==2.2.6",
    "openai==1.82.0",
    "orjson==3.10.18",
    "ormsgpack==1.9.1",
    "packaging==24.2",
    "pillow==11.3.0",
    "pydantic==2.11.5",
    "pydantic_core==2.33.2",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "requests-toolbelt==1.0.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "tenacity==9.1.2",
    "termcolor==3.1.0",
    "tqdm==4.67.1",
    "typing_extensions==4.13.2",
    "urllib3==2.4.0",
    "Werkzeug==3.1.3",
    "xxhash==3.5.0",
    "zstandard==0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/quentinducasse/decima"
Repository = "https://github.com/quentinducasse/decima"
Documentation = "https://github.com/quentinducasse/decima/tree/main/doc"
"Bug Tracker" = "https://github.com/quentinducasse/decima/issues"

[tool.setuptools]
packages = ["decima", "decima.modules", "decima.kg", "decima.tools", "decima.utils"]

[tool.setuptools.package-dir]
decima = "."
"decima.modules" = "modules"
"decima.kg" = "kg"
"decima.tools" = "tools"
"decima.utils" = "utils"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
